name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ue_backend
          POSTGRES_USER: ue_backend
          POSTGRES_PASSWORD: ue_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ue_backend -d ue_backend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Scan tracked source and configuration for secrets
        shell: pwsh
        run: |
          ./tools/security/scan-secrets.ps1 -RepoRoot .
          ./tools/security/test-secret-scan.ps1 -RepoRoot .

      - name: Run Gradle tests and Flyway migrations
        working-directory: backend
        run: ./gradlew --no-daemon --dependency-verification=strict test

      - name: Build deployable JAR
        working-directory: backend
        run: ./gradlew --no-daemon --dependency-verification=strict bootJar

      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: ./gradlew --no-daemon --dependency-verification=strict cyclonedxBom

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: backend/build/reports/cyclonedx/bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify OpenAPI contracts
        shell: pwsh
        run: ./tools/openapi/verify-openapi-stage3.ps1 -RepoRoot .
