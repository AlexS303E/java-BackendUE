spring:
  application:
    name: backend-for-ue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ue_backend}
    username: ${DB_USER:ue_backend}
    password: ${DB_PASSWORD:ue_backend}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:10}
    processing-timeout-seconds: ${OUTBOX_PROCESSING_TIMEOUT_SECONDS:60}
