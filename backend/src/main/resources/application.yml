spring:
  application:
    name: backend-for-ue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ue_backend}
    username: ${DB_USER:ue_backend}
    password: ${DB_PASSWORD:ue_backend}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:600000}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  admin:
    token: ${ADMIN_TOKEN:dev-admin-token}
    allowed-cidrs: ${ADMIN_ALLOWED_CIDRS:}
    default-roles: ${ADMIN_DEFAULT_ROLES:status,access,catalog,ops,security}
  auth:
    jwt-private-key: ${JWT_PRIVATE_KEY:}
    jwt-public-key: ${JWT_PUBLIC_KEY:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:10}
    processing-timeout-seconds: ${OUTBOX_PROCESSING_TIMEOUT_SECONDS:60}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    catalog-snapshot-ttl: ${APP_CACHE_CATALOG_SNAPSHOT_TTL:PT10M}
    access-ttl: ${APP_CACHE_ACCESS_TTL:PT5M}
  audit:
    retention:
      enabled: ${AUDIT_RETENTION_ENABLED:false}
      admin-retention: ${AUDIT_ADMIN_RETENTION:P180D}
      server-retention: ${AUDIT_SERVER_RETENTION:P90D}
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:1000}
      cleanup-interval-ms: ${AUDIT_RETENTION_CLEANUP_INTERVAL_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    window: ${RATE_LIMIT_WINDOW:PT1M}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:60}
    server-limit: ${RATE_LIMIT_SERVER_LIMIT:600}
    admin-limit: ${RATE_LIMIT_ADMIN_LIMIT:120}
  server-auth:
    mtls:
      enabled: ${SERVER_MTLS_ENABLED:false}
      port: ${SERVER_MTLS_PORT:9443}
      require-private-port: ${SERVER_MTLS_REQUIRE_PRIVATE_PORT:true}
      allow-header-fingerprint-fallback: ${SERVER_MTLS_ALLOW_HEADER_FINGERPRINT_FALLBACK:false}
      key-store: ${SERVER_MTLS_KEY_STORE:}
      key-store-password: ${SERVER_MTLS_KEY_STORE_PASSWORD:}
      key-store-type: ${SERVER_MTLS_KEY_STORE_TYPE:PKCS12}
      key-alias: ${SERVER_MTLS_KEY_ALIAS:}
      trust-store: ${SERVER_MTLS_TRUST_STORE:}
      trust-store-password: ${SERVER_MTLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${SERVER_MTLS_TRUST_STORE_TYPE:PKCS12}
      ssl-protocol: ${SERVER_MTLS_SSL_PROTOCOL:TLS}
      enabled-protocols: ${SERVER_MTLS_ENABLED_PROTOCOLS:TLSv1.3,TLSv1.2}
      connection-timeout: ${SERVER_MTLS_CONNECTION_TIMEOUT:5s}
