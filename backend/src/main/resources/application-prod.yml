server:
  shutdown: graceful
  tomcat:
    keep-alive-timeout: ${HTTP_KEEP_ALIVE_TIMEOUT:30s}
    max-keep-alive-requests: ${HTTP_MAX_KEEP_ALIVE_REQUESTS:100}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:30s}

app:
  audit:
    retention:
      enabled: ${AUDIT_RETENTION_ENABLED:true}
      admin-retention: ${AUDIT_ADMIN_RETENTION:P180D}
      server-retention: ${AUDIT_SERVER_RETENTION:P90D}
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:1000}
      cleanup-interval-ms: ${AUDIT_RETENTION_CLEANUP_INTERVAL_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: ${RATE_LIMIT_WINDOW:PT1M}
    auth-limit: ${RATE_LIMIT_AUTH_LIMIT:60}
    server-limit: ${RATE_LIMIT_SERVER_LIMIT:600}
    admin-limit: ${RATE_LIMIT_ADMIN_LIMIT:120}
  admin:
    token: ${ADMIN_TOKEN}
    allowed-cidrs: ${ADMIN_ALLOWED_CIDRS}
    default-roles: ${ADMIN_DEFAULT_ROLES:status}
  auth:
    jwt-private-key: ${JWT_PRIVATE_KEY}
    jwt-public-key: ${JWT_PUBLIC_KEY}
  server-auth:
    mtls:
      enabled: ${SERVER_MTLS_ENABLED:true}
      require-private-port: ${SERVER_MTLS_REQUIRE_PRIVATE_PORT:true}
      allow-header-fingerprint-fallback: ${SERVER_MTLS_ALLOW_HEADER_FINGERPRINT_FALLBACK:false}
      key-store: ${SERVER_MTLS_KEY_STORE}
      key-store-password: ${SERVER_MTLS_KEY_STORE_PASSWORD}
      trust-store: ${SERVER_MTLS_TRUST_STORE}
      trust-store-password: ${SERVER_MTLS_TRUST_STORE_PASSWORD}
      connection-timeout: ${SERVER_MTLS_CONNECTION_TIMEOUT:5s}
      keep-alive-timeout: ${SERVER_MTLS_KEEP_ALIVE_TIMEOUT:30s}
      max-keep-alive-requests: ${SERVER_MTLS_MAX_KEEP_ALIVE_REQUESTS:100}
