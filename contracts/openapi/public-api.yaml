openapi: 3.1.0
info:
  title: Backend For UE Public API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
  /auth/register:
    post:
      operationId: registerPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Player registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /auth/login:
    post:
      operationId: loginPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/refresh:
    post:
      operationId: refreshAuthSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
  /auth/logout:
    post:
      operationId: logoutPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Refresh token revoked
  /catalog/snapshot:
    get:
      operationId: getCatalogSnapshot
      parameters:
        - name: realm_id
          in: query
          required: false
          schema:
            type: string
            default: global
      responses:
        "200":
          description: Catalog snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSnapshot"
  /me/access:
    get:
      operationId: getMyAccess
      security:
        - bearerAuth: []
      parameters:
        - name: realm_id
          in: query
          required: false
          schema:
            type: string
            default: global
        - name: catalog_version
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Access projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessProjection"
  /me/presets:
    get:
      operationId: getMyPresets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Player presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPresets"
  /me/presets/weapons/{class_tag}/{preset_slot}:
    put:
      operationId: saveWeaponPreset
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
        - name: class_tag
          in: path
          required: true
          schema:
            type: string
        - name: preset_slot
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeaponPresetSaveRequest"
      responses:
        "200":
          description: Weapon preset saved
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaponPresetSaveResponse"
        "412":
          description: Preset revision mismatch
        "428":
          description: If-Match header required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [login_name, password]
      properties:
        login_name:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
    RegisterResponse:
      type: object
      required: [player_id, login_name, status, needs_bootstrap]
      properties:
        player_id:
          type: string
          format: uuid
        login_name:
          type: string
        status:
          type: string
        needs_bootstrap:
          type: boolean
    LoginRequest:
      type: object
      required: [login_name, password]
      properties:
        login_name:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthTokenResponse:
      type: object
      required: [player_id, access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        player_id:
          type: string
          format: uuid
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
        refresh_expires_in:
          type: integer
          format: int64
    CatalogSnapshot:
      type: object
      required: [realm_id, catalog_version, items, weapon_mounts, allowed_modules]
      properties:
        realm_id:
          type: string
        catalog_version:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
        weapon_mounts:
          type: array
          items:
            type: object
        allowed_modules:
          type: array
          items:
            type: object
    PlayerPresets:
      type: object
      required: [player_id, weapon_presets, outfit_presets]
      properties:
        player_id:
          type: string
          format: uuid
        weapon_presets:
          type: array
          items:
            type: object
        outfit_presets:
          type: array
          items:
            type: object
    WeaponPresetSaveRequest:
      type: object
      required: [catalog_version, slots]
      properties:
        catalog_version:
          type: integer
          format: int64
        slots:
          type: array
          items:
            type: object
            required: [weapon_slot_id, modules]
            properties:
              weapon_slot_id:
                type: string
              weapon_id:
                type:
                  - string
                  - "null"
              modules:
                type: array
                items:
                  type: object
                  required: [mount_id, module_id]
                  properties:
                    mount_id:
                      type: string
                    module_id:
                      type: string
    WeaponPresetSaveResponse:
      type: object
      required: [player_id, class_tag, preset_slot, catalog_version, revision, slots]
      properties:
        player_id:
          type: string
          format: uuid
        class_tag:
          type: string
        preset_slot:
          type: integer
        catalog_version:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        slots:
          type: array
          items:
            type: object
    AccessProjection:
      type: object
      required: [player_id, catalog_version, access_revision, items]
      properties:
        player_id:
          type: string
          format: uuid
        catalog_version:
          type: integer
          format: int64
        access_revision:
          type: integer
          format: int64
        items:
          type: array
          items:
            type: object
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
