openapi: 3.1.0
info:
  title: Backend For UE Server API
  version: 0.1.0
servers:
  - url: https://localhost:8443
paths:
  /server/match-profile/build:
    post:
      operationId: buildMatchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildMatchProfileRequest"
      responses:
        "200":
          description: Authoritative match profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchProfile"
        "409":
          description: Catalog version is not supported
  /server/runtime-preset-changes:
    post:
      operationId: submitRuntimePresetChanges
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimePresetChangeRequest"
      responses:
        "200":
          description: Runtime change applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePresetChangeResponse"
        "409":
          description: Revision conflict
components:
  schemas:
    BuildMatchProfileRequest:
      type: object
      required:
        - match_id
        - player_id
        - realm_id
        - class_tag
        - team_tag
        - weapon_preset_slot
        - outfit_preset_slot
        - supported_catalog_versions
        - server_build_id
      properties:
        match_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        realm_id:
          type: string
        class_tag:
          type: string
        team_tag:
          type: string
        weapon_preset_slot:
          type: integer
        outfit_preset_slot:
          type: integer
        supported_catalog_versions:
          type: array
          items:
            type: integer
            format: int64
        preferred_catalog_version:
          type: integer
          format: int64
        server_build_id:
          type: string
    MatchProfile:
      type: object
      required:
        - schema_version
        - player_id
        - realm_id
        - catalog_version
        - class_tag
        - team_tag
        - weapons
        - outfit
        - dependency_revisions
      properties:
        schema_version:
          type: integer
        player_id:
          type: string
          format: uuid
        realm_id:
          type: string
        catalog_version:
          type: integer
          format: int64
        class_tag:
          type: string
        team_tag:
          type: string
        weapon_preset_slot:
          type: integer
        outfit_preset_slot:
          type: integer
        weapons:
          type: array
          items:
            type: object
        outfit:
          type: array
          items:
            type: object
        sanitized_warnings:
          type: array
          items:
            type: string
        dependency_revisions:
          type: object
    RuntimePresetChangeRequest:
      type: object
      required:
        - operation_id
        - operation_seq
        - match_id
        - player_id
        - class_tag
        - weapon_preset_slot
        - base_weapon_preset_revision
        - runtime_change_payload
      properties:
        operation_id:
          type: string
          format: uuid
        operation_seq:
          type: integer
          format: int64
        match_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        class_tag:
          type: string
        weapon_preset_slot:
          type: integer
        base_weapon_preset_revision:
          type: integer
          format: int64
        runtime_change_payload:
          $ref: "#/components/schemas/RuntimePresetChangePayload"
    RuntimePresetChangePayload:
      type: object
      required: [schema_version, changes]
      properties:
        schema_version:
          type: integer
          const: 1
        changes:
          type: array
          items:
            type: object
            required: [op, weapon_slot_id]
            properties:
              op:
                enum: [set_weapon, clear_weapon, set_module, clear_module]
              weapon_slot_id:
                type: string
              weapon_id:
                type: string
              mount_id:
                type: string
              module_id:
                type: string
    RuntimePresetChangeResponse:
      type: object
      required: [operation_id, status, duplicate]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          enum: [applied, conflict, duplicate, rejected, failed]
        result_revision:
          type:
            - integer
            - "null"
          format: int64
        pending_change_id:
          type:
            - string
            - "null"
          format: uuid
        duplicate:
          type: boolean
        error_code:
          type:
            - string
            - "null"
