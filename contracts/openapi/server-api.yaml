openapi: 3.1.0

info:
  title: UE5 Backend Server API
  version: 0.4.0
  description: Private Dedicated Server API protected by a dedicated mTLS connector and server identity binding.

servers:
  - url: https://localhost:9443
    description: Local private mTLS connector for Dedicated Server API

tags:
  - name: server_match_profile
  - name: server_runtime_changes
  - name: server_runtime_events

paths:
  /server/match-profile/build:
    post:
      tags: [server_match_profile]
      operationId: server_match_profile_build
      summary: Build authoritative match profile snapshot for a player.
      security:
        - ServerMutualTls: []
          ServerIdentityHeader: []
      parameters:
        - $ref: '#/components/parameters/server_id_header'
        - $ref: '#/components/parameters/server_certificate_fingerprint_header_deprecated'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildMatchProfileRequest'
      responses:
        '200':
          description: Authoritative match profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CatalogVersionNotSupported'
        '422':
          $ref: '#/components/responses/LoadoutValidationFailed'

  /server/runtime-preset-changes:
    post:
      tags: [server_runtime_changes]
      operationId: server_runtime_preset_changes
      summary: Persist runtime preset changes from Dedicated Server.
      description: Idempotency-Key header is required and must equal body.operation_id.
      security:
        - ServerMutualTls: []
          ServerIdentityHeader: []
      parameters:
        - $ref: '#/components/parameters/server_id_header'
        - $ref: '#/components/parameters/server_certificate_fingerprint_header_deprecated'
        - $ref: '#/components/parameters/idempotency_key_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePresetChangeRequest'
            examples:
              set_module:
                summary: Set module during match
                value:
                  operation_id: 00000000-0000-0000-0000-000000000001
                  operation_seq: 1
                  match_id: 00000000-0000-0000-0000-000000000010
                  player_id: 00000000-0000-0000-0000-000000000020
                  class_tag: class.assault
                  weapon_preset_slot: 1
                  base_weapon_preset_revision: 12
                  runtime_change_payload:
                    schema_version: 1
                    changes:
                      - op: set_module
                        weapon_slot_id: primary
                        weapon_id: weapon.ak12
                        mount_id: weapon.ak12.mount.scope.01
                        module_id: module.scope.red_dot_01
      responses:
        '200':
          description: Runtime change applied or duplicate replay returned from the idempotency log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimePresetChangeResponse'
        '400':
          $ref: '#/components/responses/RuntimePresetChangeBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PresetRevisionConflict'
        '422':
          $ref: '#/components/responses/LoadoutValidationFailed'

  /server/runtime-events:
    post:
      tags: [server_runtime_events]
      operationId: server_runtime_event_write
      summary: Write runtime event/audit entry from Dedicated Server.
      security:
        - ServerMutualTls: []
          ServerIdentityHeader: []
      parameters:
        - $ref: '#/components/parameters/server_id_header'
        - $ref: '#/components/parameters/server_certificate_fingerprint_header_deprecated'
        - $ref: '#/components/parameters/idempotency_key_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeEventRequest'
      responses:
        '200':
          description: Runtime event accepted or duplicate replay detected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeEventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    ServerMutualTls:
      type: mutualTLS
      description: Dedicated Server must connect through the private mTLS connector. The backend computes the SHA-256 fingerprint from the TLS client certificate.
    ServerIdentityHeader:
      type: apiKey
      in: header
      name: X-Server-Id
      description: Server identity id. It is bound to the mTLS client certificate fingerprint stored in server_identities.certificate_fingerprint.

  parameters:
    server_id_header:
      name: X-Server-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid

    server_certificate_fingerprint_header_deprecated:
      name: X-Server-Certificate-Fingerprint
      in: header
      required: false
      deprecated: true
      description: Deprecated dev-only fallback. In mTLS mode the backend ignores this header and computes the fingerprint from the TLS client certificate.
      schema:
        type: string

    idempotency_key_header:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Required for non-idempotent server POST operations. For runtime-preset-changes it must equal operation_id.

  responses:
    ValidationError:
      description: Validation error.
      x-error-code: VALIDATION_ERROR
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    RuntimePresetChangeBadRequest:
      description: Validation error or IDEMPOTENCY_OPERATION_ID_MISMATCH when Idempotency-Key differs from operation_id.
      x-error-code: IDEMPOTENCY_OPERATION_ID_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthenticated:
      description: mTLS client certificate is missing, the request did not arrive through the private mTLS connector, or the server identity header/fingerprint is invalid.
      x-error-code: UNAUTHENTICATED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Server identity has insufficient scope, wrong realm binding or does not own the match.
      x-error-code: FORBIDDEN
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    CatalogVersionNotSupported:
      description: Dedicated Server does not support any catalog version allowed for this match.
      x-error-code: CATALOG_VERSION_NOT_SUPPORTED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PresetRevisionConflict:
      description: Runtime preset change cannot be applied because the durable preset revision has changed.
      x-error-code: PRESET_REVISION_CONFLICT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RuntimePresetConflictProblem'

    LoadoutValidationFailed:
      description: Loadout validation failed.
      x-error-code: LOADOUT_VALIDATION_FAILED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required: [title, status, detail, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        fields:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    RuntimePresetConflictProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [operation_id, pending_change_id, duplicate]
          properties:
            operation_id:
              type: string
              format: uuid
            pending_change_id:
              type: string
              format: uuid
            duplicate:
              type: boolean

    BuildMatchProfileRequest:
      type: object
      required:
        - match_id
        - player_id
        - realm_id
        - class_tag
        - team_tag
        - weapon_preset_slot
        - outfit_preset_slot
        - supported_catalog_versions
        - server_build_id
      properties:
        match_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        realm_id:
          type: string
        class_tag:
          type: string
        team_tag:
          type: string
        weapon_preset_slot:
          type: integer
        outfit_preset_slot:
          type: integer
        supported_catalog_versions:
          type: array
          items:
            type: integer
            format: int64
        preferred_catalog_version:
          type: [integer, 'null']
          format: int64
        server_build_id:
          type: string

    MatchProfile:
      type: object
      required:
        - schema_version
        - player_id
        - realm_id
        - catalog_version
        - class_tag
        - team_tag
        - weapon_preset_slot
        - outfit_preset_slot
        - weapons
        - outfit
        - sanitized_warnings
        - dependency_revisions
      properties:
        schema_version:
          type: integer
          const: 1
        player_id:
          type: string
          format: uuid
        realm_id:
          type: string
        catalog_version:
          type: integer
          format: int64
        class_tag:
          type: string
        team_tag:
          type: string
        weapon_preset_slot:
          type: integer
        outfit_preset_slot:
          type: integer
        weapons:
          type: array
          items:
            $ref: '#/components/schemas/MatchWeapon'
        outfit:
          type: array
          items:
            $ref: '#/components/schemas/MatchOutfitItem'
        sanitized_warnings:
          type: array
          items:
            type: string
        dependency_revisions:
          $ref: '#/components/schemas/DependencyRevisions'

    MatchWeapon:
      type: object
      required: [weapon_slot_id, weapon_id, modules]
      properties:
        weapon_slot_id:
          type: string
        weapon_id:
          type: [string, 'null']
        modules:
          type: array
          items:
            $ref: '#/components/schemas/MatchModule'

    MatchModule:
      type: object
      required: [mount_id, module_id]
      properties:
        mount_id:
          type: string
        module_id:
          type: string

    MatchOutfitItem:
      type: object
      required: [clothing_slot_id, item_id]
      properties:
        clothing_slot_id:
          type: string
        item_id:
          type: string

    DependencyRevisions:
      type: object
      required: [weapon_preset_revision, outfit_preset_revision, access_revision, profile_revision]
      properties:
        weapon_preset_revision:
          type: integer
          format: int64
        outfit_preset_revision:
          type: integer
          format: int64
        access_revision:
          type: integer
          format: int64
        profile_revision:
          type: integer
          format: int64

    RuntimePresetChangeRequest:
      type: object
      required:
        - operation_id
        - operation_seq
        - match_id
        - player_id
        - class_tag
        - weapon_preset_slot
        - base_weapon_preset_revision
        - runtime_change_payload
      properties:
        operation_id:
          type: string
          format: uuid
        operation_seq:
          type: integer
          format: int64
        match_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        class_tag:
          type: string
        weapon_preset_slot:
          type: integer
        base_weapon_preset_revision:
          type: integer
          format: int64
        runtime_change_payload:
          $ref: '#/components/schemas/RuntimePresetChangePayload'

    RuntimePresetChangePayload:
      type: object
      required: [schema_version, changes]
      properties:
        schema_version:
          type: integer
          const: 1
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RuntimePresetChangeStep'

    RuntimePresetChangeStep:
      type: object
      required: [op, weapon_slot_id]
      properties:
        op:
          type: string
          enum: [set_weapon, clear_weapon, set_module, clear_module]
        weapon_slot_id:
          type: string
        weapon_id:
          type: [string, 'null']
        mount_id:
          type: [string, 'null']
        module_id:
          type: [string, 'null']

    RuntimePresetChangeResponse:
      type: object
      required: [operation_id, status, duplicate]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, conflict, duplicate, rejected, failed]
        result_revision:
          type: [integer, 'null']
          format: int64
        pending_change_id:
          type: [string, 'null']
          format: uuid
        duplicate:
          type: boolean
        error_code:
          type: [string, 'null']

    RuntimeEventRequest:
      type: object
      required: [event_id, event_seq, match_id, event_type, payload_schema_version, occurred_at, payload]
      properties:
        event_id:
          type: string
          format: uuid
        event_seq:
          type: integer
          format: int64
        match_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [player_spawned, loadout_applied, item_used, player_died, match_finished]
        player_id:
          type: [string, 'null']
          format: uuid
        payload_schema_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    RuntimeEventResponse:
      type: object
      required: [event_id, status, duplicate]
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, duplicate]
        duplicate:
          type: boolean
