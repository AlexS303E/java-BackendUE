services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ue_backend
      POSTGRES_USER: ue_backend
      POSTGRES_PASSWORD: ue_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ue_backend -d ue_backend"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
